reflection_model: qwen3.7-flash
provider:
  api_key_env: DASHSCOPE_API_KEY
  base_url_env: DASHSCOPE_BASE_URL
  temperature: 0.0
  max_tokens: 1800
  timeout_seconds: 120.0
  max_retries: 3
  enable_thinking: false
