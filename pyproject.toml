[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-gepa-repro"
version = "0.1.0"
description = "Independent-GEPA under a matched prompt-team evaluation protocol"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyYAML>=6.0",
  "openai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
math = ["math-verify==0.6.0", "latex2sympy2_extended==1.0.9", "sympy==1.14.0",
        "antlr4-python3-runtime==4.13.2", "mpmath==1.3.0", "openai==2.37.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
